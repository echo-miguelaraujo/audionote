name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o projeto
        run: unzip -q -o app.zip -d project

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        working-directory: project
        run: npm install

      - name: Gerar o projeto Android
        working-directory: project
        run: npx expo prebuild --platform android --no-install

      - name: Compilar o APK
        working-directory: project/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Publicar o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            project/android/app/build/outputs/apk/release/app-release.apk \
            --title "Ideias - build ${{ github.run_number }}" \
            --notes "APK de teste (Fase 1)."
